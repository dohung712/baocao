<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hướng dẫn dùng tool</title>
<meta name="description" content="Hướng dẫn dùng tool Thi Đua & Bảng việc theo vai trò — tự cập nhật theo tool.">
<!-- D16: trang công khai (không cần đăng nhập) — đọc guide.json, cùng nguồn với trang 📖 Hướng dẫn trong tool -->
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#5d6470;--line:#e2e5ea;--brand:#0b6bcb;--chip:#eef3fa;--ok:#1f8a4c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1a1d23;--ink:#eceef1;--mute:#9aa1ad;--line:#2b3038;--brand:#5aa9f5;--chip:#1f2a38;--ok:#4cc27e}}
:root[data-theme="dark"]{--bg:#111317;--card:#1a1d23;--ink:#eceef1;--mute:#9aa1ad;--line:#2b3038;--brand:#5aa9f5;--chip:#1f2a38;--ok:#4cc27e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;position:sticky;top:0;background:var(--bg);z-index:2;padding-top:6px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sec{margin:0 0 6px;font-size:13px;letter-spacing:.02em;color:var(--mute);text-transform:uppercase;padding-top:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 8px}
summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"›";margin-left:auto;color:var(--mute);transition:transform .15s}
details[open] summary::after{transform:rotate(90deg)}
.c{padding:0 14px 12px;font-size:14px}
.c p{margin:6px 0}
ul{margin:6px 0;padding-left:20px}
li{margin:3px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.date{color:var(--mute);font-size:12px}
.time{font-weight:700;color:var(--brand)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px;margin-bottom:10px}
.foot{color:var(--mute);font-size:12px;margin-top:20px}
a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <h1>📖 Hướng dẫn dùng tool</h1>
  <p class="sub" id="ver">Đang tải…</p>
  <div class="tabs" id="tabs"></div>
  <div id="body"></div>
  <p class="foot">Mở tool: <a href="./">dohung712.github.io/baocao/v2</a> · Trong tool: ☰ Thêm → 📖 Hướng dẫn (có ✅ Nhập môn và 💬 Hỏi cách dùng bằng AI).</p>
</div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TABS = [["nv", "👤 Nhân viên"], ["ql", "🧑‍💼 Quản lý"], ["gd", "🎯 Giám đốc"], ["day", "📋 Lịch QL"], ["news", "🆕 Có gì mới"]];
let G = null, tab = (location.hash.slice(1) || "nv"), q = "";
const forRole = (roles, r) => roles.includes(r) || (r === "gd" && roles.includes("ql"));
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase();
function draw() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" data-t="${k}">${l}</button>`).join("");
  const b = document.getElementById("body");
  if (tab === "day") { b.innerHTML = G.qlday.map((s) => `<div class="card"><div><span class="time">${esc(s.icon)} ${esc(s.time)}</span> · <b>${esc(s.title)}</b></div><ul>${s.items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join(""); return; }
  if (tab === "news") { b.innerHTML = G.news.map((n) => `<div class="card"><b>${esc(n.title)}</b> <span class="date">${esc(n.date.slice(8))}/${esc(n.date.slice(5, 7))} · ${n.roles.map((r) => esc(G.roles[r])).join(", ")}</span><ul>${n.lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></div>`).join(""); return; }
  const list = G.cards.filter((c) => forRole(c.roles, tab) && (!q || norm([c.title, c.what, c.where, c.when, ...(c.steps || [])].join(" ")).includes(norm(q))));
  const groups = [...new Set(list.map((c) => c.group))];
  const ob = (tab === "nv" ? G.onboard.nv : G.onboard.ql) || [];
  b.innerHTML = `<input class="search" id="q" placeholder="🔎 Tìm: nộp việc, thông báo, dời hạn…" value="${esc(q)}">`
    + (!q ? `<div class="card"><b>✅ Bắt đầu (${ob.length} bước)</b><ul>${ob.map((x) => `<li><b>${esc(x.title)}</b> — ${esc(x.how)}</li>`).join("")}</ul></div>` : "")
    + groups.map((g) => `<div class="sec">${esc(g)}</div>${list.filter((c) => c.group === g).map((c) => `<details><summary><span>${c.icon}</span>${esc(c.title)}</summary><div class="c"><p>${esc(c.what)}</p><p>📍 <b>Ở đâu:</b> ${esc(c.where)}</p><p>🕑 <b>Khi nào:</b> ${esc(c.when)}</p>${c.steps?.length ? `<ul>${c.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}</div></details>`).join("")}`).join("")
    + (list.length ? "" : `<p class="sub">Không thấy mục nào.</p>`);
  const inp = document.getElementById("q");
  inp.oninput = (e) => { q = e.target.value; const pos = inp.selectionStart; draw(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
}
document.getElementById("tabs").onclick = (e) => { const t = e.target.closest("[data-t]"); if (!t) return; tab = t.dataset.t; q = ""; history.replaceState(null, "", "#" + tab); draw(); window.scrollTo(0, 0); };
fetch("guide.json?v=" + Math.floor(Date.now() / 6e5), { cache: "no-cache" }).then((r) => r.json()).then((g) => {
  G = g; if (!TABS.some(([k]) => k === tab)) tab = "nv";
  document.getElementById("ver").textContent = `Cập nhật ${g.version.slice(8)}/${g.version.slice(5, 7)}/${g.version.slice(0, 4)} · tự cập nhật mỗi khi tool đổi`;
  draw();
}).catch(() => { document.getElementById("ver").textContent = "Không tải được hướng dẫn, thử tải lại trang."; });
</script>
</body>
</html>
