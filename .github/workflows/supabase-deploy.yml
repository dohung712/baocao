name: Supabase v2 deploy

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase-deploy.yml"]
  workflow_dispatch:

concurrency: supabase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: iauxgnnybhzqeirnqaen
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Chưa có secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Áp SQL migrations
        run: node supabase/scripts/apply-migrations.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Triển khai Edge Function notify
        run: supabase functions deploy notify --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Kiểm tra (chỉ in số lượng)
        run: node supabase/scripts/verify.mjs
